  #   environment:
  #     CLICKHOUSE_USER: ${CLICKHOUSE_USER}
  #     CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  #   entrypoint: ["dbt"]
  dbt-runner:  # <--- Tạo hẳn một service riêng chuyên chạy dbt
    build: .   # Tự build từ Dockerfile cục bộ (Dockerfile cài python & dbt-clickhouse)
    env_file:
      - .env
    environment:
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    volumes:
      - .:/usr/app  # Mount toàn bộ thư mục code dbt hiện tại vào container
volumes:
  clickhouse_data:
  airflow_pg_data:
